services:
  - type: web
    name: electricalai-pro-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: ALLOWED_ORIGINS
        value: https://evogencyglobal.com,https://www.evogencyglobal.com
      - key: RATE_LIMIT_CHAT
        value: 10/hour
      # In-memory rate limiting (see backend/api/server.py) only stays
      # coherent on a single instance. Fine on Free/Starter (no
      # autoscaling on those tiers) - if this service is ever scaled to
      # multiple instances, the limiter needs a shared backend (e.g.
      # Redis) instead.
