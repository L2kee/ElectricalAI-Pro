name: frontend
description: "ElectricalAI Pro desktop application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2

  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # EVOGENCY's site font, for headings and the wordmark. Static Latin
    # subsets cut from the Google Fonts variable file (OFL, license next
    # to them), so the desktop build still works offline.
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-700.ttf
          weight: 700