<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ElectricalAI Pro: AI-powered electrical assistant and professional calculators for electricians.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ElectricalAI Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#060A12">
  <style>html, body { background: #060A12; }</style>

  <title>ElectricalAI Pro</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // "Add to Home Screen" bridge for the Dart side (lib/services/install_service.dart).
    //
    // Chrome/Edge/Android fire `beforeinstallprompt` when the page meets
    // their own installability heuristics (valid manifest, registered
    // service worker, HTTPS, some engagement). The event must be captured
    // and its default prevented immediately, then replayed later via
    // .prompt() when the user actually taps our own button - browsers
    // don't let you show it more than once per captured event.
    //
    // iOS Safari never fires this event at all and has no programmatic
    // install API of any kind - Apple only allows the user's own manual
    // Share -> "Add to Home Screen" action. That's a real platform limit,
    // not a bug, so the Dart side shows instructions instead of a button
    // there rather than pretending otherwise.
    window.__eapDeferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.__eapDeferredInstallPrompt = event;
    });

    window.addEventListener('appinstalled', () => {
      window.__eapDeferredInstallPrompt = null;
    });

    window.eapCanAutoInstall = () => window.__eapDeferredInstallPrompt !== null;

    window.eapPromptInstall = async () => {
      const promptEvent = window.__eapDeferredInstallPrompt;
      if (!promptEvent) return 'unavailable';
      window.__eapDeferredInstallPrompt = null;
      promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      return choice.outcome; // 'accepted' or 'dismissed'
    };

    window.eapIsIOS = () =>
      /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as Mac

    window.eapIsStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
